<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Serenity 发帖追踪</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">X / Twitter tracking dashboard</p>
          <h1>Serenity 发帖追踪</h1>
          <p class="subtitle">@aleabitoreddit 近期观点、股票提及和主题变化</p>
        </div>
        <a class="source-link" href="https://instalker.org/aleabitoreddit" target="_blank" rel="noreferrer">查看来源</a>
      </header>

      <section class="status-grid" aria-label="summary">
        <article class="status-card">
          <span class="label">更新时间</span>
          <strong id="updatedAt">读取中...</strong>
        </article>
        <article class="status-card">
          <span class="label">有效发帖</span>
          <strong id="postCount">--</strong>
        </article>
        <article class="status-card">
          <span class="label">核心主题</span>
          <strong id="coreTheme">--</strong>
        </article>
        <article class="status-card alert">
          <span class="label">风险提示</span>
          <strong>高波动小中盘</strong>
        </article>
      </section>

      <section class="layout">
        <article class="panel">
          <div class="panel-head">
            <h2>当前结论</h2>
            <span class="badge">自动汇总</span>
          </div>
          <p id="takeaway" class="takeaway"></p>
          <div id="recommendations" class="recommendations"></div>
        </article>

        <article class="panel">
          <div class="panel-head">
            <h2>股票提及榜</h2>
            <span class="badge neutral">近批次</span>
          </div>
          <div id="tickerList" class="ticker-list"></div>
        </article>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>主题强度</h2>
          <span class="badge neutral">按语义归类</span>
        </div>
        <div id="themes" class="theme-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>股票实时行情</h2>
            <p id="quoteNote" class="panel-note">报价可能有延迟，请以券商行情为准。</p>
          </div>
          <span class="badge neutral">自动抓取</span>
        </div>
        <div id="quotes" class="quote-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <div>
            <h2>最近发帖原文归档</h2>
            <p class="panel-note">点击任意卡片展开原文，也可以打开 X 原帖或镜像来源。</p>
          </div>
          <span class="badge neutral">最多 30 条</span>
        </div>
        <div id="posts" class="post-list"></div>
      </section>

      <footer>
        本页面是公开发帖的辅助整理，不构成投资建议。请自行核对原帖、公司公告和最新价格。
      </footer>
    </main>

    <script>
      const fallback = {
        updatedAt: "2026-05-28",
        sourceUrl: "https://instalker.org/aleabitoreddit",
        postCount: 24,
        coreTheme: "CPO / 光通信 / AI半导体供应链",
        takeaway:
          "近期内容集中在 CPO、硅光、激光器、InP 材料、功率半导体和 AI 数据中心供应链。他最强的表达集中在 SIVE 与 XFAB，AAOI、AXTI、LITE、SOI 更多作为已验证或同主题受益标的出现。",
        recommendations: [
          { ticker: "SIVE", stance: "最强关注", note: "多次称为当前最有吸引力的 CPO 敞口，提到高信心与加仓，但波动最大。" },
          { ticker: "XFAB", stance: "强关注", note: "明确说有持仓，逻辑是 photonics + power semis + EU Chips Act。" },
          { ticker: "AAOI / AXTI", stance: "已验证案例", note: "反复作为此前成功判断和瓶颈逻辑案例出现，追高风险较高。" },
          { ticker: "LITE / SOI", stance: "主题受益", note: "更成熟的光通信与材料链敞口，适合与小盘投机股区分看待。" }
        ],
        tickers: [
          ["SIVE", 8], ["NVDA", 5], ["AXTI", 5], ["AAOI", 5], ["XFAB", 4], ["LITE", 4],
          ["NOK", 3], ["SOI", 3], ["MRVL", 2], ["AMZN", 2], ["AMD", 2], ["NVTS", 2], ["POWI", 2]
        ],
        quotes: [
          { ticker: "AAOI", yahooSymbol: "AAOI", currency: "USD", price: 177.62, changePercent: 0, quoteTime: "2026-05-28T00:00:00.000Z" },
          { ticker: "LITE", yahooSymbol: "LITE", currency: "USD", price: 898.49, changePercent: 0, quoteTime: "2026-05-28T00:00:00.000Z" }
        ],
        themes: [
          { name: "CPO / 光通信", score: 95 },
          { name: "激光器 / InP 材料瓶颈", score: 82 },
          { name: "AI 数据中心供应链", score: 78 },
          { name: "功率半导体 / 800V DC", score: 55 },
          { name: "CHIPS Act 政策催化", score: 48 }
        ],
        posts: [
          {
            timeLabel: "sample",
            url: "https://x.com/aleabitoreddit",
            mirrorUrl: "https://instalker.org/aleabitoreddit",
            summary: "XFAB：称其为 photonics + power semis 的 long idea，自己已建仓，催化包括 EU Chips Act 与 NVDA/NOK 评估。",
            text: "XFAB：称其为 photonics + power semis 的 long idea，自己已建仓，催化包括 EU Chips Act 与 NVDA/NOK 评估。"
          }
        ]
      };

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
      }

      function formatNumber(value, digits = 2) {
        if (value === null || value === undefined || value === "") return "--";
        return Number.isFinite(Number(value)) ? Number(value).toLocaleString("en-US", { maximumFractionDigits: digits, minimumFractionDigits: digits }) : "--";
      }

      function formatPercent(value) {
        if (!Number.isFinite(Number(value))) return "--";
        const sign = Number(value) > 0 ? "+" : "";
        return `${sign}${Number(value).toFixed(2)}%`;
      }

      function formatDateTime(value) {
        if (!value) return "--";
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleString("zh-CN", { hour12: false });
      }

      function postSummary(post) {
        if (typeof post === "string") return post;
        return post.summary || post.text || "";
      }

      function postText(post) {
        if (typeof post === "string") return post;
        return post.text || post.summary || "";
      }

      function render(data) {
        document.getElementById("updatedAt").textContent = data.updatedAt || "--";
        document.getElementById("postCount").textContent = data.postCount || data.posts?.length || "--";
        document.getElementById("coreTheme").textContent = data.coreTheme || "--";
        document.getElementById("takeaway").textContent = data.takeaway || "";

        document.getElementById("recommendations").innerHTML = (data.recommendations || [])
          .map((item) => `<div class="rec"><b>${escapeHtml(item.ticker)}</b><span>${escapeHtml(item.stance)}</span><p>${escapeHtml(item.note)}</p></div>`)
          .join("");

        const max = Math.max(...(data.tickers || [["", 1]]).map((item) => item[1]), 1);
        document.getElementById("tickerList").innerHTML = (data.tickers || [])
          .slice(0, 14)
          .map(([ticker, count]) => `<div class="ticker-row"><span>${escapeHtml(ticker)}</span><div class="bar"><i style="width:${Math.max(8, (count / max) * 100)}%"></i></div><strong>${count}</strong></div>`)
          .join("");

        document.getElementById("themes").innerHTML = (data.themes || [])
          .map((theme) => `<div class="theme"><span>${escapeHtml(theme.name)}</span><meter min="0" max="100" value="${Number(theme.score) || 0}"></meter></div>`)
          .join("");

        const quotes = data.quotes || [];
        const latestQuoteTime = quotes.map((quote) => quote.quoteTime).filter(Boolean).sort().at(-1);
        document.getElementById("quoteNote").textContent = latestQuoteTime
          ? `最近报价时间：${formatDateTime(latestQuoteTime)}。报价可能有延迟，请以券商行情为准。`
          : "暂未获取到行情。报价可能有延迟，请以券商行情为准。";

        document.getElementById("quotes").innerHTML = quotes.length
          ? quotes.map((quote) => {
              const positive = Number(quote.changePercent) >= 0;
              const tone = positive ? "up" : "down";
              const stale = quote.stale ? `<span class="stale">上次报价</span>` : "";
              return `<article class="quote-card">
                <div class="quote-title">
                  <b>${escapeHtml(quote.ticker)}</b>
                  <span>${escapeHtml(quote.yahooSymbol || quote.ticker)}</span>
                </div>
                <strong>${escapeHtml(quote.currency || "")} ${formatNumber(quote.price)}</strong>
                <p class="${tone}">${formatNumber(quote.change)} / ${formatPercent(quote.changePercent)} ${stale}</p>
              </article>`;
            }).join("")
          : `<p class="empty">暂无可显示行情。</p>`;

        document.getElementById("posts").innerHTML = (data.posts || [])
          .slice(0, 30)
          .map((post, index) => {
            const sourceUrl = typeof post === "string" ? data.sourceUrl : (post.url || data.sourceUrl);
            const mirrorUrl = typeof post === "string" ? data.sourceUrl : (post.mirrorUrl || data.sourceUrl);
            return `<details class="post">
              <summary>
                <span>${index + 1}</span>
                <div>
                  <small>${escapeHtml(post.timeLabel || "")}</small>
                  <p>${escapeHtml(postSummary(post))}</p>
                </div>
              </summary>
              <div class="post-body">
                <p>${escapeHtml(postText(post)).replace(/\n/g, "<br>")}</p>
                <div class="post-actions">
                  <a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noreferrer">打开 X 原帖</a>
                  <a href="${escapeHtml(mirrorUrl)}" target="_blank" rel="noreferrer">打开镜像来源</a>
                </div>
              </div>
            </details>`;
          })
          .join("");
      }

      fetch("./data.json", { cache: "no-store" })
        .then((response) => response.ok ? response.json() : fallback)
        .then(render)
        .catch(() => render(fallback));
    </script>
  </body>
</html>
